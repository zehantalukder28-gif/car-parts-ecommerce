<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e7490"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#cffafe"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Outer gear ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#blade)" stroke-width="4" opacity="0.3"/>
  <!-- Turbo fan blades (simplified) -->
  <g fill="url(#blade)" transform="translate(50,50)">
    <path d="M0,-8 C8,-8 18,-22 4,-26 C-2,-28 -6,-14 0,-8Z" opacity="0.9"/>
    <path d="M0,-8 C8,-8 18,-22 4,-26 C-2,-28 -6,-14 0,-8Z" opacity="0.9" transform="rotate(72)"/>
    <path d="M0,-8 C8,-8 18,-22 4,-26 C-2,-28 -6,-14 0,-8Z" opacity="0.9" transform="rotate(144)"/>
    <path d="M0,-8 C8,-8 18,-22 4,-26 C-2,-28 -6,-14 0,-8Z" opacity="0.9" transform="rotate(216)"/>
    <path d="M0,-8 C8,-8 18,-22 4,-26 C-2,-28 -6,-14 0,-8Z" opacity="0.9" transform="rotate(288)"/>
    <!-- Center hub -->
    <circle cx="0" cy="0" r="6" fill="url(#blade)" opacity="0.95"/>
    <circle cx="0" cy="0" r="3" fill="url(#bg)"/>
  </g>
</svg>